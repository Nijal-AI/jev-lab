[project]
name = "jev-lab"
version = "0.1.0"
description = "Jev Lab : un atelier pour mettre à l’épreuve Jev, le modèle System One de TypeSafe AI, face à un LLM"
authors = [
    { name = "Nijal AI" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
